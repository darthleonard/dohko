<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Dohko Vault</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="unlock-container">
    <div class="header-icon ion-text-center">
      <ion-icon name="lock-closed" color="primary" class="hero-icon"></ion-icon>
      <h2>Vault Locked</h2>
      <p class="subtitle">Enter your master password to decrypt</p>
    </div>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Unlock Vault</ion-card-title>
        <ion-card-subtitle
          >All data remains encrypted at rest</ion-card-subtitle
        >
      </ion-card-header>

      <ion-card-content>
        <form (ngSubmit)="onUnlockWithPassword()">
          <ion-item class="ion-margin-top">
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              label="Master Password"
              labelPlacement="floating"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="Enter master password"
              [disabled]="isLoading"
            >
              <ion-button
                fill="clear"
                slot="end"
                type="button"
                (click)="showPassword = !showPassword"
                aria-label="Toggle password visibility"
              >
                <ion-icon
                  [name]="showPassword ? 'eye-off' : 'eye'"
                  slot="icon-only"
                ></ion-icon>
              </ion-button>
            </ion-input>
          </ion-item>

          @if (errorMessage) {
            <div class="error-text ion-margin-top">
              <ion-text color="danger">{{ errorMessage }}</ion-text>
            </div>
          }

          @if (isLoading) {
            <div class="loading-state ion-margin-top ion-text-center">
              <ion-spinner name="crescent" color="primary"></ion-spinner>
              <p>Verifying master key & decrypting vault...</p>
              <ion-progress-bar
                type="indeterminate"
                color="primary"
              ></ion-progress-bar>
            </div>
          }

          <ion-button
            expand="block"
            type="submit"
            class="ion-margin-top"
            [disabled]="isLoading || !password"
          >
            <ion-icon name="lock-open" slot="start"></ion-icon>
            Unlock
          </ion-button>

          @if (bioStatus?.enrolled) {
            <div class="ion-margin-top">
              <ion-button
                expand="block"
                fill="outline"
                type="button"
                color="secondary"
                (click)="onUnlockWithBiometrics()"
                [disabled]="isLoading"
              >
                <ion-icon name="finger-print" slot="start"></ion-icon>
                Unlock with Biometrics
              </ion-button>
            </div>
          }
        </form>

        <div class="recovery-section ion-margin-top ion-text-center">
          <ion-button
            fill="clear"
            size="small"
            color="medium"
            (click)="onShowRecoveryHelp()"
          >
            Forgot Password?
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
