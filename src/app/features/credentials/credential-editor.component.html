<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ (isEditing ? 'EDITOR.EDIT_TITLE' : 'EDITOR.NEW_TITLE') | translate }}</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="onCancel()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="onSave()" [disabled]="!isFormValid() || isSaving()">
        <ion-icon name="save" slot="start"></ion-icon>
        {{ 'COMMON.SAVE' | translate }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="onSave()">
    <!-- Label / Name -->
    <ion-item class="ion-margin-bottom">
      <ion-input
        [label]="'EDITOR.SERVICE_LABEL' | translate"
        labelPlacement="floating"
        [(ngModel)]="name"
        name="name"
        required
        [placeholder]="'EDITOR.SERVICE_PLACEHOLDER' | translate"
        maxlength="200"
      ></ion-input>
    </ion-item>

    <!-- Username / Email -->
    <ion-item class="ion-margin-bottom">
      <ion-input
        [label]="'EDITOR.USERNAME_EMAIL' | translate"
        labelPlacement="floating"
        [(ngModel)]="username"
        name="username"
        required
        [placeholder]="'EDITOR.USERNAME_PLACEHOLDER' | translate"
        maxlength="200"
      ></ion-input>
    </ion-item>

    <!-- Password -->
    <ion-item class="ion-margin-bottom">
      <ion-input
        [type]="showPassword ? 'text' : 'password'"
        [label]="'EDITOR.PASSWORD' | translate"
        labelPlacement="floating"
        [(ngModel)]="password"
        name="password"
        required
        [placeholder]="'EDITOR.PASSWORD_PLACEHOLDER' | translate"
        maxlength="5000"
      >
        <ion-button
          fill="clear"
          slot="end"
          type="button"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="'COMMON.TOGGLE_PASSWORD_VISIBILITY' | translate"
        >
          <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-input>
    </ion-item>

    <!-- Website URL -->
    <ion-item class="ion-margin-bottom">
      <ion-input
        type="url"
        [label]="'EDITOR.WEBSITE_OPTIONAL' | translate"
        labelPlacement="floating"
        [(ngModel)]="websiteUrl"
        name="websiteUrl"
        placeholder="https://example.com"
        maxlength="2048"
      ></ion-input>
    </ion-item>
    <ion-note *ngIf="websiteUrl && !isValidUrl(websiteUrl)" color="danger" class="url-error ion-padding-start">
      {{ 'EDITOR.INVALID_URL' | translate }}
    </ion-note>

    <!-- Notes -->
    <ion-item class="ion-margin-bottom">
      <ion-textarea
        [label]="'EDITOR.NOTES_OPTIONAL' | translate"
        labelPlacement="floating"
        [(ngModel)]="notes"
        name="notes"
        rows="4"
        [placeholder]="'EDITOR.NOTES_PLACEHOLDER' | translate"
        maxlength="10000"
      ></ion-textarea>
    </ion-item>

    <div *ngIf="errorMessage()" class="error-box ion-margin-top">
      <ion-text color="danger">{{ errorMessage() }}</ion-text>
    </div>
  </form>
</ion-content>
