<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ isEditing ? 'Edit Credential' : 'New Credential' }}</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="onCancel()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="onSave()" [disabled]="!isFormValid() || isSaving">
        <ion-icon name="save" slot="start"></ion-icon>
        Save
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="onSave()">
    <!-- Label / Name -->
    <ion-item class="ion-margin-bottom">
      <ion-input
        label="Service / Label *"
        labelPlacement="floating"
        [(ngModel)]="name"
        name="name"
        required
        placeholder="e.g. GitHub, Google, Work Email"
        maxlength="200"
      ></ion-input>
    </ion-item>

    <!-- Username / Email -->
    <ion-item class="ion-margin-bottom">
      <ion-input
        label="Username / Email *"
        labelPlacement="floating"
        [(ngModel)]="username"
        name="username"
        required
        placeholder="e.g. user@example.com"
        maxlength="200"
      ></ion-input>
    </ion-item>

    <!-- Password -->
    <ion-item class="ion-margin-bottom">
      <ion-input
        [type]="showPassword ? 'text' : 'password'"
        label="Password *"
        labelPlacement="floating"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Enter credential password"
        maxlength="5000"
      >
        <ion-button
          fill="clear"
          slot="end"
          type="button"
          (click)="showPassword = !showPassword"
          aria-label="Toggle password visibility"
        >
          <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-input>
    </ion-item>

    <!-- Website URL -->
    <ion-item class="ion-margin-bottom">
      <ion-input
        type="url"
        label="Website URL (optional)"
        labelPlacement="floating"
        [(ngModel)]="websiteUrl"
        name="websiteUrl"
        placeholder="https://example.com"
        maxlength="2048"
      ></ion-input>
    </ion-item>
    <ion-note *ngIf="websiteUrl && !isValidUrl(websiteUrl)" color="danger" class="url-error ion-padding-start">
      Please enter a valid URL (starting with http:// or https://)
    </ion-note>

    <!-- Notes -->
    <ion-item class="ion-margin-bottom">
      <ion-textarea
        label="Notes (optional)"
        labelPlacement="floating"
        [(ngModel)]="notes"
        name="notes"
        rows="4"
        placeholder="Additional notes, recovery codes, or security info"
        maxlength="10000"
      ></ion-textarea>
    </ion-item>

    <div *ngIf="errorMessage" class="error-box ion-margin-top">
      <ion-text color="danger">{{ errorMessage }}</ion-text>
    </div>
  </form>
</ion-content>
